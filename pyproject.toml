[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eelgrass-intelligence"
version = "0.1.0"
description = "ML tooling for eelgrass presence/absence detection, cover estimation, and cover-type classification, developed with CERI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
extract-frames = "eelgrass_intelligence.video_frames:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eelgrass_intelligence"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["eelgrass_intelligence"]
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
